name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Server API tests
        run: python -m unittest -v
      - name: Build public demo
        run: python build_public_demo.py
      - name: Check JavaScript syntax
        run: node --check public/app.js
      - name: Public demo tests
        run: node --test test_public_demo.mjs
      - name: Build Docker image
        run: docker build -t techno-service:ci .
      - name: Validate Compose configuration
        env:
          TECHNO_DOMAIN: kb.example.com
          TECHNO_ADMIN_EMAIL: admin@example.com
          TECHNO_ADMIN_PASSWORD: unused-ci-placeholder
        run: docker compose config --quiet
